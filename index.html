#introSplash{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
#introSplash *,#introSplash *::before,#introSplash *::after{box-sizing:border-box}
#introSplash{margin:0;height:100%;background:var(--bg);color:var(--ice);overflow:hidden;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}

#introSplash .scene{position:relative;height:100%;display:grid;place-items:center;align-content:center;
  gap:clamp(26px,6vh,56px);overflow:hidden;padding:16px;transition:opacity .7s ease;
  background:radial-gradient(ellipse at 50% 40%,#0f2a6e 0%,#070f2b 50%,#03060f 100%)}
#introSplash .scene.out{opacity:0}

/* latar */
#introSplash .halo{position:absolute;inset:0;margin:auto;width:min(140vw,1100px);aspect-ratio:1;border-radius:50%;
  filter:blur(70px);opacity:0;
  background:conic-gradient(from 0deg,rgba(225,11,23,0),rgba(225,11,23,.4),rgba(31,107,255,0) 40%,rgba(31,107,255,.5) 70%,rgba(225,11,23,0))}
#introSplash .play .halo{animation:fade 1.8s ease .5s forwards,spin 16s linear infinite}
@keyframes fade{to{opacity:.85}}
@keyframes spin{to{transform:rotate(360deg)}}
#introSplash .streak{position:absolute;left:-30%;width:160%;height:var(--h);top:var(--y);opacity:0;
  background:linear-gradient(90deg,transparent,var(--c) 30%,var(--c) 70%,transparent);
  transform:rotate(-14deg) translateX(-110%)}
#introSplash .play .streak{animation:sweep 1.5s cubic-bezier(.3,.7,.2,1) var(--t) forwards}
@keyframes sweep{0%{transform:rotate(-14deg) translateX(-110%);opacity:0}15%{opacity:.9}
  100%{transform:rotate(-14deg) translateX(110%);opacity:0}}
#introSplash .field{position:absolute;inset:0;pointer-events:none}
#introSplash .dot{position:absolute;bottom:-10px;border-radius:50%;background:#9cc4ff;opacity:0}
#introSplash .play .dot{animation:rise var(--d,9s) linear var(--w,0s) infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.8}100%{transform:translateY(-110vh);opacity:0}}

/* logo */
#introSplash .logos{position:relative;z-index:2;width:min(92vw,820px);display:grid;place-items:center}
#introSplash .finish .logos{animation:cheer .7s ease-out}
@keyframes cheer{40%{transform:scale(1.04);filter:brightness(1.25)}}
#introSplash .logo{position:relative}
#introSplash .l1{grid-area:1/1;width:100%;aspect-ratio:866/288}
#introSplash .l2{grid-area:1/1;width:min(80%,600px);aspect-ratio:1000/499}
#introSplash .play .l1{animation:float 6s ease-in-out 2.6s infinite,out1 .5s ease 3.5s forwards}
#introSplash .play .l2{animation:float 7s ease-in-out 5.2s infinite}
@keyframes out1{to{opacity:0;filter:blur(12px) brightness(1.6);visibility:hidden}}
@keyframes float{50%{transform:translateY(-7px)}}
#introSplash .layer{position:absolute;inset:0;opacity:0;filter:drop-shadow(0 10px 26px rgba(0,0,0,.5))}
#introSplash .l1 .layer{background:var(--logo1) center/100% 100% no-repeat}
#introSplash .l2 .layer{background:var(--logo2) center/100% 100% no-repeat}
#introSplash .g{clip-path:inset(0 63% 0 0);transform-origin:18% 55%}
#introSplash .t{clip-path:inset(0 0 0 36%)}
#introSplash .play .g{animation:globeIn 1.4s cubic-bezier(.2,.8,.2,1) .35s both,gone .01s 2.3s forwards}
#introSplash .play .t{animation:textIn 1.1s cubic-bezier(.2,.8,.2,1) .95s both,gone .01s 2.3s forwards}
#introSplash .play .f{animation:show .01s 2.3s forwards}
#introSplash .play .p{animation:pop 1.1s cubic-bezier(.2,.9,.25,1) 3.9s both}
@keyframes globeIn{from{opacity:0;transform:translateX(-8%) scale(.3) rotate(-160deg);filter:blur(12px)}
  to{opacity:1;transform:none;filter:blur(0)}}
@keyframes textIn{from{opacity:0;transform:translateX(-7%);clip-path:inset(0 100% 0 36%)}
  to{opacity:1;transform:none;clip-path:inset(0 0 0 36%)}}
@keyframes pop{0%{opacity:0;transform:translateX(16%) scale(.35) rotate(10deg);filter:blur(12px)}
  55%{opacity:1;transform:scale(1.1) rotate(-2deg);filter:blur(0)}100%{opacity:1;transform:none}}
@keyframes show{to{opacity:1}}
@keyframes gone{to{opacity:0;visibility:hidden}}

#introSplash .shine{position:absolute;inset:0;opacity:0;
  -webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%);
  background-size:250% 100%;background-position:100% 0}
#introSplash .l1 .shine{--m:var(--logo1)} #introSplash .l2 .shine{--m:var(--logo2)}
#introSplash .play .l1 .shine{animation:shine 3.8s ease-in-out 2.5s infinite}
#introSplash .play .l2 .shine{animation:shine 3.8s ease-in-out 5.3s infinite}
@keyframes shine{0%{opacity:.9;background-position:100% 0}38%,100%{opacity:.9;background-position:0% 0}}

#introSplash .burst{position:absolute;inset:-12%;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,255,255,.9),rgba(120,180,255,.4) 35%,transparent 65%)}
#introSplash .play .burst{animation:burst .9s ease-out 4.2s both}

<script>
(function(){
  // [optimasi link bagikan] dibuka dari link berita -> lewati intro, langsung ke berita
  try{
    var lh=(location.hash||'').toLowerCase();
    if(/^\/(?:b|berita)\/[^\/?#]+/i.test(location.pathname||'') || /[?&]berita=/.test(location.search||'') || (lh.length>=2 && lh!=='#redaksi')){
      var sp=document.getElementById('introSplash'); if(sp && sp.parentNode) sp.parentNode.removeChild(sp);
      return;
    }
  }catch(e){}
  // Isi alamat tujuan (mis. "beranda.html") agar halaman pindah setelah loading selesai.
  // Jika dikosongkan (kondisi gabungan sekarang), intro menutup sendiri lalu
  // menampilkan halaman utama website. Isi alamat bila ingin pindah halaman.
  var NEXT_URL = "";

  var scene=document.getElementById('scene'), field=document.getElementById('field');
  for(var i=0;i<26;i++){
    var s=document.createElement('span'), z=1+Math.random()*3;
    s.className='dot'; s.style.left=(Math.random()*100)+'%';
    s.style.width=s.style.height=z+'px';
    s.style.setProperty('--d',(7+Math.random()*7).toFixed(1)+'s');
    s.style.setProperty('--w',(Math.random()*5).toFixed(1)+'s');
    field.appendChild(s);
  }
  function start(){ scene.classList.add('play'); }
  function restart(){
    scene.classList.add('out');
    setTimeout(function(){
      scene.classList.remove('play','finish');
      void scene.offsetWidth;
      scene.classList.remove('out'); start();
    },800);
  }
  // ===== PENGGABUNGAN: fungsi menutup intro lalu menampilkan website utama =====
  function tutupIntro(){
    if(!document.getElementById('introSplash')) return;
    scene.classList.add('out');
    setTimeout(function(){
      var bungkus=document.getElementById('introSplash');
      if(bungkus && bungkus.parentNode) bungkus.parentNode.removeChild(bungkus);
      document.documentElement.classList.remove('lkn-intro-aktif');
      window.scrollTo(0,0);
    },750);
  }
  document.getElementById('runner').addEventListener('animationend',function(e){
    if(e.animationName!=='run') return;
    scene.classList.add('finish');
    setTimeout(function(){ if(NEXT_URL){ location.href=NEXT_URL; } else { tutupIntro(); } },1200);
  });
  document.documentElement.classList.add('lkn-intro-aktif');
  // Jaring pengaman integrasi: bila animationend tidak terpicu (mis. tab dibiarkan
  // di latar belakang), intro tetap ditutup agar website pasti tampil.
  setTimeout(tutupIntro, 20000);
  requestAnimationFrame(start);
})();
</script>

    isi: `

Pertama, ia menekankan perlunya negara menghormati metodologi khas pesantren, termasuk kajian turats atau kitab kuning, sistem halaqah, serta sanad keilmuan kiai. Menurutnya, kekhasan tersebut perlu diposisikan sebagai bagian dari sistem penjaminan mutu pesantren tanpa terjebak pada penyeragaman indikator administratif.

Menurutnya, berbagai persoalan sosial seperti perceraian dini, perkawinan anak, dan kekerasan domestik perlu dicegah sejak dari hulu melalui penguatan kemitraan Tripusat Pendidikan yang melibatkan sekolah, keluarga, dan masyarakat.

Langkah tersebut dinilai penting untuk menjaga autentisitas sanad transmisi hukum syariah agar tidak tereduksi menjadi sekadar pemenuhan persyaratan administratif.

Ia menilai pengajaran fikih dan pemahaman syariah membutuhkan integritas moral serta metodologi keilmuan yang matang. Karena itu, pendidik agama tidak cukup hanya dinilai berdasarkan portofolio teknis, tetapi juga perlu dipastikan kapasitas keilmuannya melalui keterlibatan lembaga keulamaan seperti MUI.

Kehadiran delegasi STISNU Nusantara yang berkolaborasi dengan MUI Kota Tangerang bersama mahasiswa PKU menjadi bagian dari komitmen sivitas akademika dalam mengawal regulasi pendidikan nasional agar tetap berakar pada nilai-nilai keagamaan dan keindonesiaan.

Rangkaian rekomendasi yang dihasilkan dalam FGD di Hotel Wisata Baru tersebut selanjutnya akan dihimpun secara tertulis dan diserahkan secara resmi oleh MUI Provinsi Banten kepada Badan Legislasi DPR RI serta kementerian terkait sebagai aspirasi keumatan dalam penyempurnaan RUU Sisdiknas.

Redaksi LIPUTAN KABAR NUSANTARA.INEWS

    judul: "Memahami Desil 1 hingga Desil 10: Jangan Salah Mengartikan Status Kesejahteraan Keluarga",
    tanggal: "",
    kategori: "jakarta",
    foto: "https://raw.githubusercontent.com/Haris12342/LIPUTAN-KABARI-KAMI.INEWS/2f6d8528f9da0ca6f66bcf2c5e4620108a434d9e/Chek.desil.jpg",
    isi: `
JAKARTA — Istilah desil belakangan semakin sering dibicarakan masyarakat, terutama berkaitan dengan bantuan sosial dan pemutakhiran data kesejahteraan. Namun, masih banyak masyarakat yang menganggap desil sebagai ukuran sederhana yang hanya menentukan seseorang miskin atau kaya.

Padahal, dalam Data Tunggal Sosial dan Ekonomi Nasional (DTSEN), desil merupakan pengelompokan atau pemeringkatan relatif keluarga berdasarkan tingkat kesejahteraan sosial-ekonominya. Keluarga dibagi menjadi 10 kelompok, dengan Desil 1 berada pada kelompok kesejahteraan relatif paling rendah dan Desil 10 pada kelompok relatif paling tinggi.

Apa arti Desil 1 sampai Desil 10?

Desil 1 merupakan kelompok sekitar 10 persen keluarga dengan posisi kesejahteraan relatif paling rendah. Kelompok ini menjadi salah satu kelompok yang mendapat perhatian tinggi dalam berbagai program perlindungan sosial.

Desil 2 berada pada kelompok kesejahteraan sekitar 10–20 persen terbawah.

Desil 3 berada pada kelompok sekitar 20–30 persen terbawah.

Desil 4 berada pada kelompok sekitar 30–40 persen terbawah.

Desil 5 berada di kelompok tengah, sedangkan Desil 6 sampai Desil 10 menunjukkan posisi kesejahteraan relatif yang semakin tinggi dalam pemeringkatan tersebut.

Dengan demikian, semakin besar angka desil, secara umum menunjukkan posisi kesejahteraan relatif yang semakin tinggi dibandingkan kelompok lainnya. Namun, Desil 10 tidak otomatis berarti seseorang “orang kaya raya”, sebagaimana Desil 1 juga tidak semata-mata dapat disimpulkan hanya berdasarkan jumlah penghasilan.

Bagaimana desil ditentukan?

Penentuan desil tidak hanya melihat gaji atau penghasilan seseorang. BPS menjelaskan bahwa pemeringkatan mempertimbangkan berbagai karakteristik sosial dan ekonomi secara bersama-sama.

Di antaranya meliputi kondisi rumah, sumber air minum, bahan bakar dan energi untuk memasak, kepemilikan aset, daya dan konsumsi listrik, komposisi keluarga, pendidikan, pekerjaan, kesehatan, disabilitas, serta karakteristik sosial ekonomi lainnya.

Artinya, seseorang yang mempunyai penghasilan tertentu belum tentu otomatis masuk desil tertentu. Begitu pula kepemilikan satu barang, kendaraan, rumah, atau penggunaan listrik saja tidak dapat menjadi satu-satunya dasar menentukan desil.

Mengapa desil penting bagi masyarakat?

Data desil digunakan pemerintah sebagai salah satu dasar untuk menentukan sasaran dan prioritas berbagai program, termasuk program perlindungan sosial. Namun, desil bukan berarti daftar otomatis penerima bantuan. Setiap program memiliki kriteria dan ketentuan masing-masing.

Karena kondisi ekonomi keluarga dapat berubah, posisi desil juga dapat berubah setelah data diperbarui. Oleh sebab itu, masyarakat perlu memastikan data kependudukan dan kondisi sosial ekonominya tercatat sesuai keadaan sebenarnya.

Apabila masyarakat merasa data keluarganya belum sesuai, terdapat mekanisme pemutakhiran melalui kanal yang disediakan pemerintah, termasuk melalui desa/kelurahan, Dinas Sosial, maupun kanal resmi terkait DTSEN dan Cek Bansos. Pengajuan pembaruan data juga tidak berarti desil akan otomatis berubah, karena data harus melalui proses pemutakhiran dan penghitungan kembali.

Jangan Salah Paham tentang Desil

Pemahaman yang tepat sangat penting agar masyarakat tidak mudah percaya pada informasi yang mengklaim bahwa Desil 1 pasti miskin, Desil 10 pasti kaya, atau setiap desil memiliki batas penghasilan tertentu.

BPS menegaskan bahwa desil adalah posisi relatif kesejahteraan, bukan ukuran tunggal pendapatan, kekayaan, maupun pengeluaran keluarga. Bahkan keluarga yang berada dalam desil yang sama belum tentu mempunyai pendapatan, pengeluaran, aset, dan kondisi sosial ekonomi yang persis sama.

Dengan memahami desil secara benar, masyarakat dapat lebih bijak melihat data kesejahteraan, memahami proses penyaluran program pemerintah, serta ikut berperan dalam memastikan data sosial ekonomi keluarga tetap akurat dan sesuai kondisi nyata.

Redaksi LIPUTAN KABAR NUSANTARA.INEWS
    `
  },

  {
    judul: "Cara Mengecek Desil Kesejahteraan Keluarga melalui Cek Bansos",
    tanggal: "",
    kategori: "banten",
    foto: "https://raw.githubusercontent.com/Haris12342/LIPUTAN-KABARI-KAMI.INEWS/2f6d8528f9da0ca6f66bcf2c5e4620108a434d9e/Chek.desil.jpg",
    isi: `
KABUPATEN TANGERANG — Masyarakat kini dapat melakukan pengecekan data kesejahteraan keluarga secara mandiri melalui laman resmi Cek Bansos Kementerian Sosial RI.

Pengecekan ini penting dilakukan untuk mengetahui apakah data keluarga sudah tercatat sesuai kondisi sosial ekonomi yang sebenarnya, termasuk informasi mengenai desil kesejahteraan.

Desil merupakan pemeringkatan relatif kesejahteraan keluarga dalam Data Tunggal Sosial dan Ekonomi Nasional (DTSEN). Terdapat 10 kelompok desil, dengan Desil 1 sebagai kelompok kesejahteraan 10 persen terbawah dan Desil 10 sebagai kelompok 10 persen tertinggi.

Cara Mengecek Desil

Masyarakat dapat mengikuti langkah berikut:

1. Buka laman resmi Cek Bansos Kemensos

Akses Cek Bansos Kemensos RI melalui telepon genggam atau komputer.

2. Siapkan NIK

Masukkan 16 digit Nomor Induk Kependudukan (NIK) sesuai yang tercantum pada KTP.

3. Masukkan kode keamanan

Ketik huruf atau kode yang ditampilkan pada kolom yang tersedia. Apabila kode kurang jelas, dapat menggunakan tombol untuk memperbarui kode.

4. Klik “CARI DATA”

Setelah NIK dan kode keamanan dimasukkan dengan benar, tekan CARI DATA. Sistem akan menampilkan informasi yang tersedia berdasarkan data DTSEN.

5. Perhatikan informasi

Apabila data desil tersedia, masyarakat dapat melihat posisi kesejahteraan keluarganya. Perlu dipahami bahwa desil merupakan peringkat relatif, bukan label permanen bahwa seseorang “miskin” atau “kaya”.

Bagaimana Jika Desil Tidak Sesuai?

Masyarakat yang merasa data yang tercatat tidak sesuai dengan kondisi sebenarnya dapat mengajukan pemutakhiran data melalui desa/kelurahan atau Dinas Sosial. Laman resmi Cek Bansos juga menyebutkan bahwa data desil bersifat dinamis dan dapat diperbarui berdasarkan kondisi nyata, kemudian dilakukan penghitungan ulang secara berkala.

Karena itu, masyarakat diimbau memastikan data seperti NIK, anggota keluarga, pekerjaan, kondisi rumah, pendidikan, kepemilikan aset, dan kondisi sosial ekonomi lainnya tercatat dengan benar.

Catatan Penting bagi Masyarakat

Jangan memberikan NIK, foto KTP, KK, atau data pribadi kepada pihak yang tidak jelas hanya dengan alasan ingin membantu mengecek atau menaikkan/menurunkan desil.

Pengecekan dapat dilakukan secara mandiri melalui kanal resmi pemerintah.

Selain itu, desil bukan satu-satunya penentu otomatis seseorang menerima bantuan sosial, karena setiap program pemerintah memiliki kriteria dan ketentuan masing-masing. Laman resmi Cek Bansos saat ini menyebutkan bahwa Desil 1–4 dapat diusulkan sebagai sasaran PKH dan Sembako, sedangkan Desil 5 dapat diusulkan untuk PBI-JK.

Mari cek data kita sendiri, pastikan sesuai kondisi sebenarnya, dan jangan mudah percaya informasi yang belum berasal dari sumber resmi pemerintah.

Cek datanya — pahami desilnya — pastikan datanya benar.

Redaksi LIPUTAN KABAR NUSANTARA.INEWS
    `
  },
  {
  judul: "LSM SILIWANGI BERSATU GERUDUK KEMENTERIAN ATR/BPN JAKARTA, DESAK PENYELESAIAN RESIDU PTSL 2018–2020 DAN KETIDAKJELASAN BPHTB SERTA PPh TERUTANG",
  tanggal: "",
  kategori: "Pertanahan",
  foto: "https://raw.githubusercontent.com/Haris12342/LIPUTAN-KABARI-KAMI.INEWS/82ec55ee89236f94ed0e390b128025f0ea8f56bf/%22LSM%20SILIWANGI%20BERSATU%20GERUDUK%20KEMENTERIAN%20ATR/BPN%20JAKARTA%2C%20DESAK%20PENYELESAIAN%20RESIDU%20PTSL%202018%E2%80%932020%20DAN%20KETIDAKJELASAN%20BPHTB%20SERTA%20PPh%20TERUTANG.webp",
  isi: `JAKARTA — 21-10-2026 LSM Siliwangi Bersatu melaksanakan aksi penyampaian aspirasi di Kementerian Agraria dan Tata Ruang/Badan Pertanahan Nasional (ATR/BPN) Selasa, 20 Oktober 2026 di Jakarta.

Aksi tersebut dilakukan untuk mendesak penyelesaian persoalan residu Program Pendaftaran Tanah Sistematis Lengkap (PTSL) tahun anggaran 2018–2020 serta meminta kejelasan mengenai BPHTB dan PPh terutang yang berkaitan dengan administrasi pertanahan masyarakat.

Dalam aksi tersebut, perwakilan LSM Siliwangi Bersatu diterima oleh pejabat Kementerian ATR/BPN untuk menyampaikan aspirasi dan pengaduan terkait sejumlah persoalan pertanahan yang menjadi perhatian organisasi tersebut.

Aksi yang dikoordinatori oleh Bung BEKA ini merupakan bentuk kepedulian LSM Siliwangi Bersatu terhadap masyarakat yang membutuhkan kepastian hukum atas tanahnya, khususnya masyarakat yang hingga kini masih menghadapi kendala penyelesaian administrasi sertipikat.

Residu PTSL 2018–2020 Menjadi Sorotan

Berdasarkan dokumen pengaduan yang disampaikan, persoalan residu PTSL meliputi Kecamatan Curug pada tahun anggaran 2019 dengan jumlah sekitar 2.000 sertipikat dan Kecamatan Walantaka pada tahun anggaran 2020 dengan jumlah sekitar 1.500 sertipikat.

Selain itu, dokumen tersebut menyoroti sekitar 500 sertipikat masyarakat di Kelurahan Pancalaksana yang disebut belum memperoleh kejelasan waktu penyelesaian.

Kondisi tersebut menimbulkan pertanyaan mengenai status administrasi permohonan, kendala penerbitan sertipikat, serta target penyelesaian bagi masyarakat yang telah mengikuti program PTSL.

LSM Siliwangi Bersatu meminta Kementerian ATR/BPN memberikan perhatian serius dan melakukan koordinasi dengan Kantor Wilayah BPN Provinsi Banten serta Kantor Pertanahan Kota Serang untuk menelusuri persoalan tersebut.

Menurut LSM Siliwangi Bersatu, masyarakat membutuhkan kejelasan informasi mengenai status berkas dan langkah konkret untuk menyelesaikan sertipikat yang masih tertunda.

BPHTB dan PPh Terutang Milik Masyarakat Dipertanyakan

Selain residu PTSL, persoalan Bea Perolehan Hak atas Tanah dan Bangunan (BPHTB) serta Pajak Penghasilan (PPh) terutang juga menjadi perhatian dalam aksi tersebut.

Dalam dokumen pengaduan, disebutkan adanya kendala administrasi yang berdampak pada proses penghapusan BPHTB terutang dan pemecahan sertipikat tanah milik masyarakat.

Permasalahan ini dinilai perlu mendapatkan penjelasan yang menyeluruh dari instansi berwenang, terutama terkait mekanisme penyelesaian, persyaratan, dasar hukum, dan batas waktu penanganan setiap permohonan.

LSM Siliwangi Bersatu meminta agar persoalan tersebut ditelusuri berdasarkan dokumen masing-masing kasus sehingga penyebab hambatan dapat diketahui secara objektif.

LSM Siliwangi Bersatu tersebut juga mendorong adanya koordinasi antara instansi pertanahan dan instansi perpajakan terkait sesuai kewenangan masing-masing, agar masyarakat memperoleh kepastian mengenai proses yang harus ditempuh.

Permohonan Buku Tanah Pengganti Turut Disoroti

<script>
(function() {
  const videoIDs = [
  "UMe1AKUyUN0",
  "hFsof3_AkB4",
  "DOOrIxw5xOw", // LIVE 03 - KOMPAS TV
  "rQJoEpzKkNk"  // LIVE 04 - TVONE
];

const players = [null, null, null, null];
const ready = [false, false, false, false];
  const intros = [
    document.getElementById("intro1"),
    document.getElementById("intro2"),
    document.getElementById("intro3"),
    document.getElementById("intro4")
  ];

  const buttons = document.querySelectorAll(".lkn-audio-btn");
  const wrapper = document.getElementById("lkn-live-ruang");

  let mulai = false;

  // AUTOPLAY INTRO (MUTE) — pengunjung yang sudah pernah
  // melihat intro langsung dilempar ke live tanpa jeda
  function putarIntro() {
    if (!tampilkanIntro()) return;
    intros.forEach(function(video) {
      if (!video) return;
      video.muted = true;
      const p = video.play();
      if (p && p.catch) p.catch(function() {});
    });
  }

  // INTRO GAGAL MUAT -> SEMBUNYIKAN, BIAR LIVE TETAP TAMPIL
  intros.forEach(function(video) {
    if (!video) return;
    video.addEventListener("error", function() {
      video.classList.add("hidden");
    }, true);
  });

  // ===== v21: ANTI-JEDA — LIVE TETAP JALAN SAAT KEMBALI =====
  const KUNCI_INTRO = "lknIntroPernahTampil";

  function tandaiIntroPernah() {
    try { sessionStorage.setItem(KUNCI_INTRO, "1"); } catch (e) {}
  }

  function introPernahTampil() {
    try {
      return sessionStorage.getItem(KUNCI_INTRO) === "1";
    } catch (e) { return false; }
  }

  // Masuk lagi dalam sesi yang sama -> intro dilewati,
  // langsung menampilkan live yang sedang berjalan
  function tampilkanIntro() {
    if (introPernahTampil()) {
      intros.forEach(function(video) {
        if (!video) return;
        video.pause();
        video.classList.add("hidden");
      });
      return false;
    }
    return true;
  }

  // Hidupkan lagi player yang berhenti sendiri
  // (PAUSED / UNSTARTED / CUED) tanpa mengubah pilihan suara
  function hidupkanLagi(index) {
    const player = players[index];
    if (!player || !ready[index]) return;
    try {
      const keadaan = player.getPlayerState();
      if (keadaan !== YT.PlayerState.PLAYING &&
          keadaan !== YT.PlayerState.BUFFERING) {
        player.playVideo();
      }
    } catch (e) {}
  }

  function hidupkanSemuaLagi() {
    for (let i = 0; i < players.length; i++) hidupkanLagi(i);
  }

  // Kembali dari tab lain / minimalkan jendela / tombol kembali
  // (bfcache) -> pastikan semua live berjalan lagi
  document.addEventListener("visibilitychange", function() {
    if (document.visibilityState === "visible") hidupkanSemuaLagi();
  });
  window.addEventListener("pageshow", hidupkanSemuaLagi);
  window.addEventListener("focus", hidupkanSemuaLagi);

  // BUAT SEMUA LIVE
  function createPlayers() {

    videoIDs.forEach(function(id, index) {

      players[index] = new YT.Player(
        "lknPlayer" + (index + 1),
        {
          videoId: id,

          playerVars: {
            autoplay: 1,
            mute: 1,
            controls: 0,
            disablekb: 1,
            fs: 0,
            rel: 0,
            playsinline: 1,
            enablejsapi: 1,
            iv_load_policy: 3,
            modestbranding: 1
          },

          events: {

            onReady: function(event) {

              ready[index] = true;

              // LIVE OTOMATIS BERJALAN DALAM KEADAAN MUTE
              event.target.mute();
              event.target.setVolume(100);
              event.target.playVideo();

              buttons[index].disabled = false;
            },

            onStateChange: function(event) {

              // SAAT LIVE BENAR-BENAR MULAI:
              // INTRO MEMUDAR HALUS LALU HILANG
              if (event.data === YT.PlayerState.PLAYING) {

                const intro = intros[index];
                intro.classList.add("pudar");
                setTimeout(function() {
                  intro.pause();
                  intro.classList.add("hidden");
                }, 700);
                tandaiIntroPernah();

                // Status mengikuti pilihan suara agar teks
                // SUARA AKTIF tidak ikut terreset saat resume
                const elStatus = document.getElementById(
                  "status" + (index + 1)
                );
                const tombolAktif = document.querySelector(
                  ".lkn-audio-btn.active"
                );
                if (tombolAktif) {
                  const iAktif = Number(tombolAktif.dataset.audio);
                  elStatus.textContent =
                    index === iAktif ? "SUARA AKTIF" : "LIVE TETAP BERJALAN";
                  elStatus.classList.toggle("on", index === iAktif);
                } else {
                  elStatus.textContent = "LIVE BERJALAN";
                }
              }

              // LIVE TIDAK BOLEH BERHENTI: stream yang berakhir
              // langsung diputar lagi otomatis (players[index] dipakai
              // agar tidak bergantung pada event.target)
              if (event.data === YT.PlayerState.ENDED) {
                try { players[index].playVideo(); } catch (e) {}
              }

              if (event.data === YT.PlayerState.BUFFERING) {
                document.getElementById(
                  "status" + (index + 1)
                ).textContent = "LIVE MEMUAT...";
              }
            },

            onError: function() {
              document.getElementById(
                "status" + (index + 1)
              ).textContent = "LIVE TIDAK TERSEDIA";
            }
          }
        }
      );

    });
  }

  // LOAD YOUTUBE API
  function loadYouTubeAPI() {

    if (window.YT && window.YT.Player) {
      createPlayers();
      return;
    }

    window.onYouTubeIframeAPIReady = createPlayers;

    if (!document.querySelector(
      'script[src="https://www.youtube.com/iframe_api"]'
    )) {
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      document.head.appendChild(script);
    }
  }

  // MULAI HANYA SAAT WIDGET TERLIHAT DI LAYAR
  // (hemat data; begitu terlihat, live tetap otomatis jalan)
  function mulaiSemua() {
    if (mulai) return;
    mulai = true;
    keAtasFooter();
    putarIntro();
    loadYouTubeAPI();
  }

  if (wrapper && "IntersectionObserver" in window) {
    let tungguFooter = 0;
    const io = new IntersectionObserver(function(entri) {
      entri.forEach(function(e) {
        if (e.isIntersecting) {
          // [optimasi] saat halaman baru dibuka, widget masih di posisi sementara
          // (belum dipindah ke atas footer) sehingga terbaca "terlihat" dan 4 player
          // YouTube langsung dimuat bersamaan dengan website. Pindahkan dulu ke posisi
          // akhir, lalu mulai hanya kalau memang sudah terlihat di layar.
          const diPosisi = keAtasFooter();
          if (!diPosisi && tungguFooter < 6) {
            tungguFooter++;
            setTimeout(function() { io.unobserve(wrapper); io.observe(wrapper); }, 1500);
            return;
          }
          if (diPosisi) {
            const r = wrapper.getBoundingClientRect();
            const vh = window.innerHeight || document.documentElement.clientHeight;
            if (r.bottom <= 0 || r.top >= vh) return;
          }
          io.disconnect();
          mulaiSemua();
        }
      });
    }, { threshold: 0.12 });
    io.observe(wrapper);
  } else {
    mulaiSemua();
  }

  // MUTE SEMUA AUDIO TANPA MENGHENTIKAN VIDEO
  function muteAll() {

    players.forEach(function(player) {
      if (player) {
        try {
          player.mute();
        } catch(e) {}
      }
    });

  }

  // GANTI SUARA SAJA, VIDEO TETAP BERJALAN
  function selectAudio(index) {

    if (!ready[index] || !players[index]) return;

    // Hanya mematikan audio semua LIVE
    muteAll();

    // Aktifkan suara LIVE pilihan
    // TIDAK ADA playVideo() DI SINI
    players[index].unMute();
    players[index].setVolume(100);

    buttons.forEach(function(button) {
      button.classList.toggle(
        "active",
        Number(button.dataset.audio) === index
      );
    });

    // Perbarui status masing-masing LIVE
    for (let i = 0; i < players.length; i++) {

      const el = document.getElementById(
        "status" + (i + 1)
      );

      el.textContent =
        i === index
          ? "SUARA AKTIF"
          : "LIVE TETAP BERJALAN";

      el.classList.toggle("on", i === index);
    }
  }

  // TOMBOL SUARA
  buttons.forEach(function(button) {

    button.addEventListener("click", function() {
      selectAudio(Number(button.dataset.audio));
    });

  });

  // ===== POSISI OTOMATIS (v20) =====
  // Widget ditaruh persis di ATAS footer situs,
  // tanpa mengubah satu baris kode React situs.
  function keAtasFooter() {
    if (!wrapper) return false;
    const footer = document.querySelector("footer");
    if (!footer || !footer.parentNode) return false;
    if (wrapper.parentNode === footer.parentNode &&
        wrapper.nextElementSibling === footer) return true;
    footer.parentNode.insertBefore(wrapper, footer);
    return true;
  }

  keAtasFooter();

  if (wrapper && "MutationObserver" in window) {
    let t = null;
    new MutationObserver(function() {
      clearTimeout(t);
      t = setTimeout(keAtasFooter, 120);
    }).observe(document.body, { childList: true, subtree: true });
  }

})();
</script>
